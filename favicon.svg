<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0b0d19" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="#0b0d19" rx="128"/>
  <rect width="100%" height="100%" fill="url(#glow)"/>
  
  <!-- Neon Tic-Tac-Toe Grid -->
  <g stroke-linecap="round">
    <!-- Grid Lines -->
    <line x1="192" y1="96" x2="192" y2="416" stroke="#2b304c" stroke-width="16"/>
    <line x1="320" y1="96" x2="320" y2="416" stroke="#2b304c" stroke-width="16"/>
    <line x1="96" y1="192" x2="416" y2="192" stroke="#2b304c" stroke-width="16"/>
    <line x1="96" y1="320" x2="416" y2="320" stroke="#2b304c" stroke-width="16"/>

    <!-- Glowing Cyan X -->
    <path d="M120,120 L168,168 M168,120 L120,168" stroke="#00f2fe" stroke-width="20" filter="drop-shadow(0 0 8px #00f2fe)"/>

    <!-- Glowing Pink O -->
    <circle cx="256" cy="256" r="30" stroke="#f35588" stroke-width="20" fill="none" filter="drop-shadow(0 0 8px #f35588)"/>

    <!-- Glowing Cyan X -->
    <path d="M344,344 L392,392 M392,344 L344,392" stroke="#00f2fe" stroke-width="20" filter="drop-shadow(0 0 8px #00f2fe)"/>
  </g>
</svg>
